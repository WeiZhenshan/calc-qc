spring:
  application:
    name: calc-qc
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/calc_qc?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:calc_qc}
    password: ${DB_PASSWORD:}
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
