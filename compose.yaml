services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: calc_qc
      MYSQL_USER: calc_qc
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/calc_qc?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: calc_qc
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
